<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/login.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Đăng ký</title>
  </head>
  <body>
    <div id="wrapper">
      <div class="container">
        <form action="" id="form-login">
          <h1 class="form-heading">Register</h1>
          <div class="form-group">
            <i
              class="fa-solid fa-user highlightwhite"
              style="padding-right: 15px"
            ></i>
            <input
              type="text"
              style="color: white"
              class="form-input"
              placeholder="Username"
            />
          </div>
          <div class="form-group">
            <i class="fa-regular fa-envelope highlightwhite"></i>
            <input
              type="text"
              style="color: white"
              class="form-input"
              placeholder="Email"
            />
          </div>
          <div class="form-group">
            <i class="fa-solid fa-lock highlightwhite"></i>
            <input
              type="password"
              style="color: white"
              class="form-input"
              id="password"
              placeholder="Password"
            />
            <span id="toggle"
              ><i class="fa-solid fa-eye highlightwhite"></i
            ></span>
          </div>
          <div class="form-group">
            <i class="fa-solid fa-lock highlightwhite"></i>
            <input
              type="password"
              style="color: white"
              class="form-input"
              id="password"
              placeholder="Confirm Password"
            />
            <span id="toggle"
              ><i class="fa-solid fa-eye highlightwhite"></i
            ></span>
          </div>
          <div class="form-group">
            <i class="fa-solid fa-phone highlightwhite"></i>
            <input
              type="text"
              style="color: white"
              class="form-input"
              placeholder="Numberphone"
            />
          </div>
          <div class="Terms">
            <input type="checkbox" name="DK" class="Terms of Service" />
            <label>Đồng ý với điều khoản sử dụng và chính sách bảo mật</label>
          </div>
          <input type="submit" value="Đăng ký" class="form-submit" />
          <div class="Haveacc">
            <a href="login.html">Already have an account?</a>
          </div>
          <div class="Terms-content">
            <a href="" class="TOU">Terms of use</a>
            <a href="">Privacy Policy</a>
          </div>
        </form>
      </div>
    </div>
    <script src="../js/login.js"></script>
  </body>
</html>
