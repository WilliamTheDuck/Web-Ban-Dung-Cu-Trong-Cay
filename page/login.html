    <title>Đăng nhập</title>
  </head>
  <body>
    <header>
      <nav class="menu">
        <div class="logo">Green</div>
         <ul class="menu">
            <li><a class="active" href="#">Trang chủ</a></li>

        </ul>
        <div><i class="fa-solid fa-user"></i></div>
      </nav>
    </header>
    <div id="wrapper">
      <div class="container">
        <form action="" id="form-login">
          <h1 class="form-heading">LOGIN</h1>
          <div class="form-group">
            <i
              class="fa-solid fa-user highlightwhite"
              style="padding-right: 15px"
            ></i>
            <input
              type="text"
              style="color: white"
              class="form-input"
              placeholder="Username or Email"
            />
          </div>
          <div class="form-group">
            <i
              class="fa-solid fa-lock highlightwhite"
              style="padding-right: 15px"
            ></i>
            <input
              type="password"
              style="color: white"
              class="form-input"
              id="password"
              placeholder="Password"
            />
            <span id="toggle"
              ><i class="fa-solid fa-eye highlightwhite"></i
            ></span>
          </div>
          <input type="submit" value="Đăng nhập" class="form-submit" />
          <div class="remember">
            <div class="check-rem">
              <input type="checkbox" name="Remember me" class="rmb" />
              <label>Remember me</label>
            </div>
            <a href="">Forgot your password?</a>
          </div>
          <div class="Dontacc">
            <a href="register.html">Tôi không có tài khoản</a>
          </div>
        </form>
      </div>
    </div>
